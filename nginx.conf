# ============================================================
# Nginx — conexo.dev
# Coloque em: /etc/nginx/sites-available/conexo
# Ative: ln -s /etc/nginx/sites-available/conexo /etc/nginx/sites-enabled/conexo
# ============================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name conexo.dev www.conexo.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — backend API (FastAPI na porta 8000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name conexo.dev www.conexo.dev;

    # Certificados SSL (gerados pelo Certbot)
    ssl_certificate     /etc/letsencrypt/live/conexo.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conexo.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Segurança
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 5m;   # aceita áudio até 5MB (Whisper)

    # Proxy para o FastAPI (Docker na porta 8000)
    location /nexo/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # SSE (streaming) — desativa buffer
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Health check público
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Docs FastAPI bloqueados (só localhost)
    location ~ ^/(docs|redoc|openapi.json) {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Frontend PWA — servir estático (opcional se usar Vercel/Netlify)
    # location / {
    #     root /var/www/conexo-pwa/dist;
    #     try_files $uri $uri/ /index.html;
    # }
}
